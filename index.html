<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Zapret GUI Launcher</title>
    <style>
        :root {
            --bg: #0f111a;
            --card: #1a1d2e;
            --text: #ffffff;
            --text-dim: #8b92b2;
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.3);
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ff4757;
        }

        body.theme-purple {
            --bg: #130f25;
            --card: #1f183d;
            --accent: #9d4edd;
            --accent-glow: rgba(157, 78, 221, 0.3);
        }

        body.theme-blue {
            --bg: #0b1528;
            --card: #12223f;
            --accent: #3a86ff;
            --accent-glow: rgba(58, 134, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        .titlebar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            -webkit-app-region: drag;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.1);
            z-index: 10;
        }

        .titlebar-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

            .titlebar-title img {
                width: 18px;
                height: 18px;
                border-radius: 3px;
            }

        .titlebar button {
            -webkit-app-region: no-drag;
            background: transparent;
            border: none;
            color: var(--text);
            width: 28px;
            height: 28px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }

            .titlebar button:hover {
                background: rgba(255, 255, 255, 0.1);
            }

        .content {
            flex: 1;
            padding: 16px;
            position: relative;
            overflow-y: auto;
        }

        .tab-content {
            display: none;
            height: 100%;
            flex-direction: column;
        }

            .tab-content.active {
                display: flex;
            }

        .center-content {
            align-items: center;
            justify-content: center;
        }

        .power-btn {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--card);
            border: 3px solid var(--border);
            color: var(--text-dim);
            font-size: 45px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
        }

            .power-btn.active {
                border-color: var(--accent);
                color: var(--accent);
                box-shadow: 0 0 35px var(--accent-glow);
            }

        .status-text {
            font-size: 14px;
            color: var(--text-dim);
            margin-top: 5px;
        }

        h3 {
            font-size: 16px;
            margin-bottom: 12px;
            text-align: center;
        }

        .btn-action {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

            .btn-action:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

        .btn-donate {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            color: #fff;
            font-weight: bold;
            margin-top: 15px;
        }

        .setting-item-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

            .setting-item-link:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            .setting-item-link span.arrow {
                font-size: 16px;
                color: var(--text-dim);
            }

            .setting-item-link:hover span.arrow {
                color: var(--accent);
            }

        .input-field, select {
            width: 100%;
            padding: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            margin-top: 6px;
            font-size: 13px;
            outline: none;
        }

        textarea.input-field {
            height: 130px;
            resize: none;
            font-family: monospace;
            user-select: text;
        }

        .navbar {
            height: 55px;
            background: var(--card);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 12px;
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 8px;
            transition: all 0.2s;
            font-weight: 500;
        }

            .nav-btn.active, .nav-btn:hover {
                color: var(--accent);
                background: rgba(255, 255, 255, 0.05);
            }

        #easterEggModal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

            #easterEggModal img {
                max-width: 220px;
                border-radius: 12px;
                margin-bottom: 12px;
            }

            #easterEggModal h3 {
                color: var(--danger);
                font-size: 20px;
            }

        /* СКРЫТЫЙ ОВЕРЛЕЙ ПАСХАЛКИ «ВОДА» */
        #waterOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 15px;
            overflow: hidden;
        }

        #waterCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .water-controls {
            position: relative;
            z-index: 55;
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .drain-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }

            .drain-btn:hover {
                background: rgba(0, 242, 254, 0.2);
                border-color: var(--accent);
            }

        .screen-shake {
            animation: screenShakeAnim 0.4s ease-in-out;
        }

        @keyframes screenShakeAnim {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-4px, 4px);
            }

            50% {
                transform: translate(4px, -4px);
            }

            75% {
                transform: translate(-3px, -2px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>
<body id="appBody">

    <!-- Пасхалка Спама -->
    <div id="easterEggModal">
        <img src="cat.png" alt="Кот">
        <h3>не так быстро!</h3>
        <button class="btn-action" style="width: 120px; margin-top: 15px;" onclick="closeEasterEgg()">Понял</button>
    </div>

    <div class="titlebar">
        <div class="titlebar-title">
            <img src="icon.png" alt="logo">
            <span>Zapret GUI Launcher</span>
        </div>
        <div>
            <button onclick="handleThemeClick()">🎨</button>
            <button onclick="minWin()">−</button>
            <button onclick="closeWin()">✕</button>
        </div>
    </div>

    <div class="content">
        <!-- Оверлей пасхалки «Вода» -->
        <div id="waterOverlay">
            <canvas id="waterCanvas"></canvas>

            <div class="water-controls">
                <button id="pourBtn" class="drain-btn" onclick="togglePour()">💧 Налить</button>
                <button class="drain-btn" onclick="startDrain()">🌀 Слить воду</button>
                <button class="drain-btn" onclick="closeWaterOverlay()">✕ Закрыть</button>
            </div>
        </div>

        <!-- Раздел 1: Включение -->
        <div id="tab1" class="tab-content center-content active">
            <h2 id="welcomeTitle" style="margin-bottom: 20px;">Добро пожаловать</h2>
            <button id="mainPowerBtn" class="power-btn" onclick="toggleZapret()">⏻</button>
            <div id="status" class="status-text">Статус: Отключено</div>
        </div>

        <!-- Раздел 2: Конфиг -->
        <div id="tab2" class="tab-content">
            <h3 style="margin-bottom: 10px;">Пресеты и Конфигурации</h3>

            <label style="font-size: 12px; color: var(--text-dim);">Имя нового пресета (без .txt):</label>
            <input type="text" id="presetName" class="input-field" placeholder="Например: my_config">

            <input type="file" id="fileInput" accept=".txt" style="display: none;" onchange="processFile(this.files[0])">
            <button class="btn-action" style="margin-top: 12px;" onclick="document.getElementById('fileInput').click()">
                ➕ Загрузить пресет (.txt)
            </button>

            <div id="presetStatus" style="margin-top: 12px; font-size: 12px; text-align: center;"></div>
        </div>

        <!-- Раздел 3: Адрес -->
        <div id="tab3" class="tab-content">
            <h3>Управление Адресами</h3>
            <textarea id="bulkSites" class="input-field" placeholder="example.com&#10;youtube.com"></textarea>
            <button class="btn-action" onclick="addSites()">➕ Добавить в список</button>
            <button class="btn-action" onclick="openNotepad()">📝 Открыть файлы в Блокноте</button>
        </div>

        <!-- Раздел 4: Настройки -->
        <div id="tab4" class="tab-content">
            <h3>Настройки</h3>

            <label style="font-size: 12px; color: var(--text-dim); margin-top: 10px; display: block;">Стратегия обхода:</label>
            <select id="strategySelect" class="input-field">
                <option value="general.bat">General (Стандарт)</option>
                <option value="general (ALT).bat">General (ALT)</option>
                <option value="general (ALT2).bat">General (ALT2)</option>
                <option value="general (ALT3).bat">General (ALT3)</option>
                <option value="general (ALT4).bat">General (ALT4)</option>
                <option value="general (ALT5).bat">General (ALT5)</option>
                <option value="general (ALT6).bat">General (ALT6)</option>
                <option value="general (ALT7).bat">General (ALT7)</option>
                <option value="general (ALT8).bat">General (ALT8)</option>
                <option value="general (ALT9).bat">General (ALT9)</option>
                <option value="general (ALT10).bat">General (ALT10)</option>
                <option value="general (ALT11).bat">General (ALT11)</option>
                <option value="general (ALT12).bat">General (ALT12)</option>
            </select>

            <button class="btn-action" style="margin-top: 15px;" onclick="flushDns()">🧹 Очистить кэш DNS</button>

            <!-- Пункт со стрелочкой для вызова пасхалки -->
            <div class="setting-item-link" onclick="openWaterOverlay()">
                <span>Вода</span>
                <span class="arrow">›</span>
            </div>

            <button class="btn-action btn-donate" onclick="openDonate()">❤️ Поддержать автора (Донат)</button>
        </div>
    </div>

    <div class="navbar">
        <button class="nav-btn active" onclick="goTab(1, this)">1-включение</button>
        <button class="nav-btn" onclick="goTab(2, this)">2-конфиг</button>
        <button class="nav-btn" onclick="goTab(3, this)">3-адрес</button>
        <button class="nav-btn" onclick="goTab(4, this)">4-настройки</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const path = require('path');

        function minWin() { ipcRenderer.send('window-min'); }
        function closeWin() { ipcRenderer.send('window-hide'); }

        // Смена тем и Пасхалка спама
        const themes = ['', 'theme-purple', 'theme-blue'];
        let tIdx = 0;
        let clickCount = 0;
        let clickTimer = null;

        function handleThemeClick() {
        clickCount++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { clickCount = 0; }, 1500);

        if (clickCount >= 5) {
        document.getElementById('easterEggModal').style.display = 'flex';
        clickCount = 0;
        } else {
        tIdx = (tIdx + 1) % themes.length;
        document.body.className = themes[tIdx];
        }
        }

        function closeEasterEgg() {
        document.getElementById('easterEggModal').style.display = 'none';
        }

        // Переключение вкладок
        function goTab(num, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab' + num).classList.add('active');
        btn.classList.add('active');
        }

        // Включение/Выключение Zapret
        let isRunning = false;
        function toggleZapret() {
        isRunning = !isRunning;
        const btn = document.getElementById('mainPowerBtn');
        const status = document.getElementById('status');
        const title = document.getElementById('welcomeTitle');

        if (isRunning) {
        btn.classList.add('active');
        status.innerText = 'Статус: Запущено';
        status.style.color = 'var(--accent)';
        title.innerText = 'Приятного использования!';

        const selectedBat = document.getElementById('strategySelect').value;
        runBat(selectedBat);
        } else {
        btn.classList.remove('active');
        status.innerText = 'Статус: Отключено';
        status.style.color = 'var(--text-dim)';
        title.innerText = 'Добро пожаловать';
        ipcRenderer.send('stop-winws');
        }
        }

        function runBat(name) {
        const p = path.join(__dirname, 'zapret-core', name);
        ipcRenderer.send('run-cmd', `cmd.exe /c "cd /d "${path.dirname(p)}" && "${p}""`);
        }

        function isValidDomain(str) {
        const pattern = new RegExp(/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$/i);
        return pattern.test(str.trim());
        }

        function processFile(file) {
        if (!file) return;
        const nameInput = document.getElementById('presetName').value.trim();
        const presetName = nameInput || file.name.replace('.txt', '');
        const status = document.getElementById('presetStatus');

        const reader = new FileReader();
        reader.onload = function(e) {
        const textContent = e.target.result;
        const lines = textContent.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        let validCount = 0;

        lines.forEach(line => {
        if (isValidDomain(line)) validCount++;
        });

        if (validCount === 0) {
        status.innerText = '❌ Файл содержит неверные адреса или мусор!';
        status.style.color = 'var(--danger)';
        } else {
        ipcRenderer.send('save-preset', { filename: presetName, content: textContent });
        status.innerText = `✅ Пресет "${presetName}.txt" сохранён в zapret-core/lists/!`;
        status.style.color = 'var(--accent)';
        }
        };
        reader.readAsText(file);
        }

        function openDonate() {
        ipcRenderer.send('open-link', 'https://dalink.to/in4ch0');
        }

        function flushDns() {
        ipcRenderer.send('run-cmd', 'ipconfig /flushdns');
        alert('DNS Очищен!');
        }

        function openNotepad() {
        const p = path.join(__dirname, 'zapret-core', 'lists', 'list-general.txt');
        ipcRenderer.send('run-cmd', `cmd.exe /c notepad "${p}"`);
        }

        function addSites() {
        const val = document.getElementById('bulkSites').value.trim();
        if (!val) return alert('Вставьте хотя бы один адрес!');

        ipcRenderer.send('append-hosts', val);

        alert('Адреса успешно добавлены в list-general.txt!');
        document.getElementById('bulkSites').value = '';
        }

        // ==========================================
        // ЛОГИКА ПАСХАЛКИ «ВОДА»
        // ==========================================
        let canvas, ctx;
        let waterLevel = 0;
        let isFlowing = false;
        let isDraining = false;
        let isStuck = false;
        let lemons = [];
        let drops = [];

        function openWaterOverlay() {
        const overlay = document.getElementById('waterOverlay');
        overlay.style.display = 'flex';

        canvas = document.getElementById('waterCanvas');
        if (!canvas) return;
        canvas.width = overlay.clientWidth;
        canvas.height = overlay.clientHeight;
        ctx = canvas.getContext('2d');

        if (!window.waterAnimRunning) {
        window.waterAnimRunning = true;
        requestAnimationFrame(animLoop);
        }
        }

        function closeWaterOverlay() {
        document.getElementById('waterOverlay').style.display = 'none';
        isFlowing = false;
        document.getElementById('pourBtn').innerText = '💧 Налить';
        }

        function togglePour() {
        if (isStuck) return;

        const roll = Math.random();
        if (roll < 0.10) {
        triggerLemonEvent();
        return;
        }

        isFlowing = !isFlowing;
        document.getElementById('pourBtn').innerText = isFlowing ? '⏸ Стоп' : '💧 Налить';
        }

        function triggerLemonEvent() {
        isStuck = true;
        isFlowing = false;
        document.getElementById('pourBtn').innerText = '🍋 Застряло!';

        setTimeout(() => {
        document.getElementById('appBody').classList.add('screen-shake');

        lemons.push({
        x: canvas.width / 2,
        y: -20,
        vy: 4,
        rot: 0,
        vr: (Math.random() - 0.5) * 0.2
        });

        setTimeout(() => {
        document.getElementById('appBody').classList.remove('screen-shake');
        isStuck = false;
        isFlowing = true;
        document.getElementById('pourBtn').innerText = '⏸ Стоп';
        }, 400);

        }, 600);
        }

        function startDrain() {
        isFlowing = false;
        isDraining = true;
        document.getElementById('pourBtn').innerText = '💧 Налить';
        }

        function animLoop() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const width = canvas.width;
        const height = canvas.height;

        if (isFlowing) {
        if (waterLevel < height - 60) {
        waterLevel += 0.8;
        }
        for (let i = 0; i < 3; i++) {
        drops.push({
        x: width / 2 + (Math.random() - 0.5) * 16,
        y: 0,
        vy: Math.random() * 4 + 7,
        radius: Math.random() * 2 + 2
        });
        }
        }

        if (isDraining) {
        if (waterLevel > 0) {
        waterLevel -= 2.5;
        } else {
        waterLevel = 0;
        isDraining = false;
        }
        }

        ctx.fillStyle = 'rgba(0, 242, 254, 0.7)';
        for (let i = drops.length - 1; i >= 0; i--) {
        let d = drops[i];
        d.y += d.vy;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
        ctx.fill();

        if (d.y >= height - waterLevel) {
        drops.splice(i, 1);
        }
        }

        if (waterLevel > 0) {
        ctx.fillStyle = 'rgba(0, 242, 254, 0.45)';
        ctx.beginPath();
        ctx.rect(0, height - waterLevel, width, waterLevel);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillRect(0, height - waterLevel, width, 2);
        }

        for (let i = lemons.length - 1; i >= 0; i--) {
        let l = lemons[i];
        const targetY = height - waterLevel - 15;

        if (l.y < targetY) {
        l.vy += 0.4;
        l.y += l.vy;
        } else {
        l.y = targetY + Math.sin(Date.now() * 0.005) * 3;
        l.vy = 0;
        }

        l.rot += l.vr;

        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.rotate(l.rot);
        ctx.font = '28px Segoe UI Emoji';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🍋', 0, 0);
        ctx.restore();

        if (isDraining && waterLevel <= 5) {
        lemons.splice(i, 1);
        }
        }

        requestAnimationFrame(animLoop);
        }
    </script>
</body>
</html>
